version: 2
updates:
  # Keep the SHA-pinned actions current. The cooldown gives a new release a week
  # to be vetted before Dependabot proposes it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The site has no npm dependencies today; this covers any that get added later.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
