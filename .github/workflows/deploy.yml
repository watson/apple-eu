name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The published site is index.html plus src/. Nothing else (research, scripts,
    # docs, workflows) affects it, so only changes to those two paths trigger a deploy.
    paths:
      - 'index.html'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never cancels a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Validate datasets before publishing
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Assemble the site (only what the page needs)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R src _site/src
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
